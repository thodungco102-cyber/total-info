name: Auto Update Fuel Prices

on:
  schedule:
    - cron: '0 */6 * * *'  # Tự động chạy 6 tiếng 1 lần
  workflow_dispatch:        # Cho phép bấm chạy thủ công trên giao diện GitHub

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run Scraper
        run: python crawler.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel_data.json
          git commit -m "Auto-update fuel prices [skip ci]" || exit 0
          git push
